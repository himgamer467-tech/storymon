<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMon</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-animation"></div>

<div class="container">

<h1>🐉 StoryMon</h1>
<p class="subtitle">Build • Own • Evolve</p>

<div class="card leaderboard">
<h2>🏆 Top StoryMon</h2>
<div id="topCreature">No creatures yet</div>
</div>

<div class="card">
<p id="counter">Total Creatures: 0</p>

<input
id="searchInput"
type="text"
placeholder="🔍 Search StoryMon..."
oninput="renderCreatures()">

<select
id="filterType"
onchange="renderCreatures()">
<option value="All">All Types</option>
<option>Fire</option>
<option>Water</option>
<option>Earth</option>
<option>Air</option>
<option>Shadow</option>
    </select>
    
<h2>Create Creature</h2>

<label>Creature Name</label>
<input id="name" type="text" placeholder="Red Dragon">

<label>Builder Name</label>
<input id="owner" type="text" placeholder="salaar">

<label>Image URL</label>
<input id="image" type="text" placeholder="https://image-link.com">

<label>Element Type</label>
<select id="type">
    <option>Fire</option>
    <option>Water</option>
    <option>Earth</option>
    <option>Air</option>
    <option>Shadow</option>
</select>

<label>Rarity</label>
<select id="rarity">
    <option>Common</option>
    <option>Rare</option>
    <option>Epic</option>
    <option>Legendary</option>
</select>

<label>Creature Story</label>
<textarea
id="description"
placeholder="Write your creature story here..."
></textarea>

<button id="createBtn">
Create StoryMon
</button>
    
<div class="card">

<h2>⚔️ Battle Arena</h2>

<select id="fighter1"></select>

<select id="fighter2"></select>

<button id="battleBtn">
Start Battle
</button>

<div id="battleResult"></div>
    
<h3>Battle History</h3>
<div id="battleHistory"></div>
</div>
    
</div>

<div id="gallery"></div>

</div>

<script src="app.js"></script>

</body>
</html>
