<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMon</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>StoryMon</h1>
    <p class="subtitle">
    Build • Own • Evolve
    </p>

    <p id="counter">Total Creatures: 0</p>
    <p class="subtitle">Create and own unique creatures.</p>

    <div class="card leaderboard">
        <h2>🏆 Top StoryMon</h2>
        <div id="topCreature">
            No creatures yet
        </div>
    </div>

    <div class="card">

        <h2>Create Creature</h2>

        <label>Creature Name</label>
        <input id="name" type="text" placeholder="Shadow Wolf">

        <label>Builder Name</label>
        <input id="owner" type="text" placeholder="Salaar">

        <label>Creature Image URL</label>
        <input id="image" type="text" placeholder="Paste image link here">

        <label>Element Type</label>
        <select id="type">
            <option>Fire</option>
            <option>Water</option>
            <option>Earth</option>
            <option>Air</option>
            <option>Shadow</option>
        </select>

        <label>Rarity</label>
        <select id="rarity">
            <option>Common</option>
            <option>Rare</option>
            <option>Epic</option>
            <option>Legendary</option>
        </select>

        <label>Story / Description</label>
        <textarea
            id="description"
            placeholder="Tell the story of your creature..."
        ></textarea>

        <button id="createBtn">
            Create Creature
        </button>

    </div>

    <div id="gallery"></div>

</div>

<script src="app.js"></script>

</body>
</html>
