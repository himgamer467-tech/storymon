<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMon</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>StoryMon</h1>

<p id="counter">Total Creatures: 0</p>
<p class="subtitle">Create and own unique creatures.</p>

<div class="card">
<h2>🏆 Top StoryMon</h2>

<div id="topCreature">
No creatures yet
</div>
</div>

<div class="card">

<h2>Create Creature</h2>

<input
id="name"
type="text"
placeholder="Creature Name"
>

<input
id="owner"
type="text"
placeholder="Builder Name"
>

<input
id="image"
type="text"
placeholder="Image URL"
>

<select id="type">
<option>Fire</option>
<option>Water</option>
<option>Earth</option>
<option>Air</option>
<option>Shadow</option>
</select>

<select id="rarity">
<option>Common</option>
<option>Rare</option>
<option>Epic</option>
<option>Legendary</option>
</select>

<textarea
id="description"
placeholder="Describe your creature..."
></textarea>

<button id="createBtn">
Create Creature
</button>

</div>

<div id="gallery"></div>

</div>

<script src="app.js"></script>

</body>
</html>
