<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryMon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>StoryMon</h1>
    <p class="subtitle">Create and own unique creatures.</p>

    <div class="card">
      <h2>Create Creature</h2>

      <input type="text" placeholder="Creature Name" />

      <select>
        <option>Fire</option>
        <option>Water</option>
        <option>Earth</option>
        <option>Air</option>
        <option>Shadow</option>
      </select>

      <textarea placeholder="Describe your creature..."></textarea>

      <button>Create Creature</button>
    </div>

    <div class="card creature">
      <h2>Solar Fox</h2>
      <p><strong>Type:</strong> Fire</p>
      <p>A legendary fox born from solar storms.</p>
      <span class="badge">Genesis Creature</span>
    </div>
  </div>
  
<script src="app.js"></script>
</body>
</html>
